<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>KenoAi — Your AI workspace for focused work</title>
    <meta name="description" content="KenoAi brings fast AI conversations, projects, tasks, files, and GitHub context into one private workspace for focused teams." />
    <meta name="keywords" content="AI workspace, AI assistant, project management, AI chat, KenoAi, GitHub assistant, team productivity" />
    <meta name="author" content="KenoAi" />
    <meta name="application-name" content="KenoAi" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f2fc" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <link rel="canonical" href="https://kenoai.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KenoAi" />
    <meta property="og:title" content="KenoAi — Your AI workspace for focused work" />
    <meta property="og:description" content="Conversations, tasks, projects, files, and GitHub context in one private AI workspace." />
    <meta property="og:url" content="https://kenoai.app/" />
    <meta property="og:image" content="https://kenoai.app/icon-192.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="KenoAi — Your AI workspace for focused work" />
    <meta name="twitter:description" content="Conversations, tasks, projects, files, and GitHub context in one private AI workspace." />
    <meta name="twitter:image" content="https://kenoai.app/icon-192.png" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet" />

    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "KenoAi",
      "applicationCategory": "ProductivityApplication",
      "operatingSystem": "Web",
      "description": "Fast, private AI chat assistant with streaming answers, code highlighting, image understanding and voice input.",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
    }
    </script>

    <!-- Speed: reserve theme before CSS to avoid flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('kenoai_theme');
          // accept both raw ('light') and JSON-wrapped ("light") values from store.set
          var light = t ? (t === 'light' || t === '\"light\"' || JSON.parse(t) === 'light') : true;
          document.documentElement.dataset.theme = light ? 'light' : 'dark';
        } catch (e) { document.documentElement.dataset.theme = 'light'; }
      })();
    </script>
    <style>html{background:#f5f2fc}</style>
</head>
  <body>
    <div id="root"></div>
    <noscript>KenoAi requires JavaScript. Please enable JavaScript to chat with your AI assistant.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
